services:
  - type: web
    name: darbs-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TTS_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_IMAGE_MODEL
        value: imagen-3.0-generate-002

